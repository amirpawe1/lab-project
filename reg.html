<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSaver - Registration</title>
    <link rel="stylesheet" href="reg.css">
    <link rel="icon" type="image/png" href="images/leaf.png">
    <script src="reg.js" defer></script>
</head>
<body>

<div class="wrapper">

    <header class="site-header">
        <a href="main.html" class="logo-link">
            <img src="images/leaf.png" alt="FoodSaver logo">
            <span>FoodSaver</span></a>
        <nav>
            <a href="reg.html">Register</a>
            <a href="main.html">Main</a>
            <a href="ingredients.html">My ingredients</a>
            <a href="recipes.html">Recipes</a>
            <a href="tips.html">Tips</a>
            <a href="aboutus.html">About us</a>
        </nav>
    </header>

    <main class="registration">
        <form id="registrationForm" novalidate>
            <h1>Create Account</h1>
            <p class="subtitle">Join FoodSaver and reduce food waste!</p>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Enter your full name" required>
            <small class="error" id="fullNameError"></small>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="example@email.com" required>
            <small class="error" id="emailError"></small>

            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" name="birthday" required>
            <small class="error" id="birthdayError"></small>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>
            <small class="hint">
                8+ characters, uppercase, lowercase and a digit.
            </small>
            <small class="error" id="passwordError"></small>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Repeat your password" required>
            <small class="error" id="confirmPasswordError"></small>

            <label for="reason">How did you hear about FoodSaver?</label>
            <select id="reason" name="reason" required>
                <option value="">Choose an option</option>
                <option value="friends">Friends or family</option>
                <option value="social">Social media</option>
                <option value="university">University</option>
                <option value="other">Other</option>
            </select>
            <small class="error" id="reasonError"></small>

            <div class="consent">
                <input type="checkbox" id="consent" name="consent">
                <label for="consent">
                    I agree to the terms and privacy policy.
                </label>
            </div>
            <small class="error" id="consentError"></small>

            <button type="submit">Create Account</button>

            <p id="formMessage" role="status"></p>
        </form>
    </main>
<footer class="podval1">
    <div class="podval2">
        <p>&copy; 2026 FoodSaver. All rights reserved.</p>

        <ul class="podval3">
            <li><a href="aboutus.html">About us</a></li>
            <li><a href="contacts.html">Contacts</a></li>
            <li><a href="confidision.html">Privacy</a></li>
        </ul>
    </div>
</footer>
</div>
</body>
</html>
